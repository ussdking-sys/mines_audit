[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "bc-mines-lab"
version         = "1.1.0"
description     = "BC.Game Mines Provably Fair Audit Framework"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"
dependencies    = ["rich>=13.0.0"]

[project.scripts]
bc-mines-lab = "main:main"

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts      = "-v --tb=short"

[tool.pyright]
pythonVersion  = "3.12"
typeCheckingMode = "basic"
